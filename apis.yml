name: Ready (formerly Argent)
description: >-
  Ready (formerly Argent) is a self-custodial crypto wallet and smart-account
  platform for Starknet and Ethereum. It builds account-abstraction wallets
  (Ready Wallet, Ready Multisig, Web Wallet), the Ready Card for cashing out, and
  developer tooling for dApps — session keys, paymasters / gas abstraction,
  outside execution, multicalls, and signature/cosigner verification — shipped as
  first-party client SDKs (StarknetKit, @argent/x-sessions, web3.swift,
  starknet.swift). The company rebranded from Argent to Ready; developer
  resources live at docs.ready.co and the argentlabs GitHub organization. Its
  developer surface is client SDKs rather than a public REST API.
